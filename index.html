<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari's Cloud Project</title>
    <style>
        body {
            background-color: #0f172a; /* Dark background like a terminal */
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #38bdf8;
            padding: 50px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 4rem; /* VERY BIG TEXT */
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            font-size: 1.5rem;
            opacity: 0.8;
        }
        .badge {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">AWS + Terraform Project</div>
        <h1>HARIHARAN</h1>
        <p>Cloud & Infrastructure Services | Data Center Operations</p>
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        <p>This site is served globally via <b>Amazon CloudFront</b></p>
    </div>
</body>
</html>
